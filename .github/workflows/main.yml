# 1. Define the Workflow Name (visible in the Actions tab)
name: Generate Contribution Grid Widget

# 2. Define the Triggers (when to run the workflow)
on:
  # Run on a schedule (every Sunday at 00:00 UTC)
  schedule:
    - cron: "0 0 * * 0" 
  # Allow manual runs from the GitHub Actions tab
  workflow_dispatch:
  # Also run when code is pushed to the 'main' branch
  push:
    branches:
      - main

# 3. Define the Jobs (the tasks to be performed)
jobs:
  generate-widget:
    # Run the job on the latest Ubuntu runner
    runs-on: ubuntu-latest
    
    # Steps are the sequence of actions to execute
    steps:
      # Step A: Checkout the repository code
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          # This line is crucial: it fetches the full history, needed for the snake action
          fetch-depth: 0 

      # Step B: Run the specific widget generator action (Your Snippet)
      - name: Generate contribution grid
        uses: Platane/snk@v3.4.0
        with:
          # Replace 'H-Loon' with your actual GitHub username
          github_user_name: H-Loon 
          # The file name where the output SVG will be saved
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg
            dist/snake-animation.gif

      # Step C: Commit the generated file back to the repository
      - name: Commit files
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add dist/*.svg dist/*.gif
          git commit -m "🤖 Update contribution grid widget" || echo "No changes to commit"

      # Step D: Push the committed changes
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
